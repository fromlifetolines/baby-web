<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <defs>
        <radialGradient id="micGrad" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#E0E7FF"/>
            <stop offset="60%" stop-color="#818CF8"/>
            <stop offset="100%" stop-color="#4F46E5"/>
        </radialGradient>
        <filter id="micGlow"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#818CF8" flood-opacity="0.6"/></filter>
    </defs>
    <!-- Mic Grille Top -->
    <ellipse cx="50" cy="32" rx="14" ry="18" fill="url(#micGrad)" stroke="#FFFFFF" stroke-width="2" filter="url(#micGlow)"/>
    <ellipse cx="50" cy="32" rx="14" ry="18" fill="none" stroke="#312E81" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="36" y1="32" x2="64" y2="32" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="42" y="46" width="16" height="4" rx="2" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
    <!-- Mic Body & Handle -->
    <path d="M43 50 L46 76 L54 76 L57 50 Z" fill="#1F2937" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="48" y="56" width="4" height="8" rx="1" fill="#10B981"/>
    <!-- Cord / Wireless base -->
    <ellipse cx="50" cy="77" rx="5" ry="3" fill="#6B7280"/>
    <circle cx="50" cy="80" r="2" fill="#F43F5E"/>
    <!-- Sound Waves -->
    <path d="M28 24 C24 28 24 36 28 40" stroke="#FF6F61" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M72 24 C76 28 76 36 72 40" stroke="#FF6F61" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
