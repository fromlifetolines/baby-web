<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
        <defs>
            <radialGradient id="woodGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffaa5e"/>
                <stop offset="100%" stop-color="#8b3a00"/>
            </radialGradient>
            <filter id="neonGlow"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#6FFF00" flood-opacity="0.6"/></filter>
        </defs>
        <!-- Ukulele body -->
        <ellipse cx="50" cy="65" rx="22" ry="26" fill="url(#woodGrad)" stroke="#6FFF00" stroke-width="1.5" filter="url(#neonGlow)"/>
        <ellipse cx="50" cy="48" rx="16" ry="14" fill="url(#woodGrad)" stroke="#6FFF00" stroke-width="1.2"/>
        <circle cx="50" cy="56" r="6" fill="#010828" stroke="#fff" stroke-width="1"/>
        <!-- Neck & Head -->
        <rect x="47" y="16" width="6" height="30" rx="2" fill="#5c2805" stroke="#6FFF00" stroke-width="0.8"/>
        <path d="M44 10 H56 V18 H44 Z" fill="#8b3a00" stroke="#6FFF00" stroke-width="1"/>
        <!-- Tuning Pegs -->
        <circle cx="42" cy="12" r="2" fill="#EFF4FF"/><circle cx="42" cy="16" r="2" fill="#EFF4FF"/>
        <circle cx="58" cy="12" r="2" fill="#EFF4FF"/><circle cx="58" cy="16" r="2" fill="#EFF4FF"/>
        <!-- Strings -->
        <line x1="48" y1="15" x2="48" y2="75" stroke="#EFF4FF" stroke-width="0.75" opacity="0.9"/>
        <line x1="49.3" y1="15" x2="49.3" y2="75" stroke="#EFF4FF" stroke-width="0.75" opacity="0.9"/>
        <line x1="50.7" y1="15" x2="50.7" y2="75" stroke="#EFF4FF" stroke-width="0.75" opacity="0.9"/>
        <line x1="52" y1="15" x2="52" y2="75" stroke="#EFF4FF" stroke-width="0.75" opacity="0.9"/>
    </svg>