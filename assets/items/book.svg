<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
        <defs><filter id="glowBk"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#6FFF00" flood-opacity="0.6"/></filter></defs>
        <!-- Ancient Book Binding -->
        <rect x="22" y="20" width="56" height="62" rx="4" fill="#92400e" stroke="#6FFF00" stroke-width="2" filter="url(#glowBk)"/>
        <!-- Book spine stitching -->
        <line x1="28" y1="20" x2="28" y2="82" stroke="#fde68a" stroke-width="2" stroke-dasharray="4 6"/>
        <!-- Title Label -->
        <rect x="44" y="26" width="20" height="46" rx="2" fill="#fef3c7" stroke="#78350f" stroke-width="1"/>
        <text x="54" y="42" fill="#78350f" font-size="7" font-weight="bold" text-anchor="middle">孫子</text>
        <text x="54" y="56" fill="#78350f" font-size="7" font-weight="bold" text-anchor="middle">兵法</text>
    </svg>